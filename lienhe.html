<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liên hệ - Hanami Bookstore</title>

    <!-- Liên kết trực tiếp file CSS của trang chủ -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<div id="header_container"></div>

<!-- ===== NỘI DUNG NẰM GIỮA ===== -->
<main class="page-container" style="max-width: 1200px; margin: 30px auto; padding: 20px; background: #fff; min-height: 400px; border-radius: 8px;">
    <h1 style="color: #8B4513; margin-bottom: 20px;">Thông Tin Liên Hệ</h1>

    <div style="display: flex; gap: 40px; flex-wrap: wrap;">
        <!-- Cột trái: Thông tin -->
        <div style="flex: 1; min-width: 280px; line-height: 2;">
            <h2>Hanami Bookstore</h2>
            <p><i class="fas fa-map-marker-alt"></i> <strong>Địa chỉ:</strong> 12 Chùa Bộc, Hà Nội, Việt Nam</p>
            <p><i class="fas fa-phone"></i> <strong>Hotline:</strong> 0982 909 069</p>
            <p><i class="fas fa-envelope"></i> <strong>Email:</strong> hanamibookstore@gmail.com</p>
        </div>

        <!-- Cột phải: Form gửi thông tin -->
        <div style="flex: 1; min-width: 280px; background: #f9f9f9; padding: 20px; border-radius: 8px;">
            <h3 style="margin-bottom: 15px;">Gửi thông tin cho chúng tôi</h3>
            <form action="#" method="post">
                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Họ và tên:</label>
                    <input type="text" placeholder="Nhập họ và tên" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Email:</label>
                    <input type="email" placeholder="Nhập địa chỉ email" required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;">
                </div>

                <div style="margin-bottom: 15px;">
                    <label style="display: block; margin-bottom: 5px;">Nội dung:</label>
                    <textarea rows="4" placeholder="Nhập nội dung tin nhắn..." required style="width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </div>

                <button type="submit" style="background: #8B4513; color: white; border: none; padding: 10px 20px; border-radius: 4px; cursor: pointer;">Gửi liên hệ</button>
            </form>
        </div>
    </div>
    <div class="map-section" style="margin-top: 30px;">
    <h3 style="margin-bottom: 15px; color: #333;">Bản đồ vị trí</h3>
    <div style="width: 100%; border-radius: 8px; overflow: hidden; box-shadow: 0 2px 5px rgba(0,0,0,0.1);">
        <iframe 
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3724.096814183571!2d105.85227301533216!3d21.02881189315339!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x3135ab953357c995%3A0x11b0b5b5b5b5b5b5!2sH%C3%A0%20N%E1%BB%99i!5e0!3m2!1svi!2svn!4v1600000000000!5m2!1svi!2svn" 
            width="100%" 
            height="350" 
            style="border:0;" 
            allowfullscreen="" 
            loading="lazy">
        </iframe>
    </div>
</div>
</main>

<!-- ===== FOOTER ===== -->
<div id="footer_container"></div>
<script src="script.js"></script>
<script src="header_footer.js"></script>
</body>
</html>
