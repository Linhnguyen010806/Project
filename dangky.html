<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng ký - Hanami BookStore</title>
    <link rel="stylesheet" href="thongbao.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-container">

    <!-- Bên trái -->
     <div class="auth-intro">

    <!-- <div class="book-icon">📖</div> -->

    <h1>Hanami BookStore</h1>

    <div class="intro-line"></div>

    <p class="slogan">
    <span>Mở một trang sách,</span>
    <span>mở một thế giới.</span>
    </p>

    <p class="intro-text">
        Hanami BookStore đồng hành cùng bạn<br>
        trên mỗi hành trình khám phá tri thức.
    </p>

    <div class="quote">
        “Bắt đầu hành trình khám phá những cuốn sách yêu thích của bạn.”
    </div>

</div>


    <!-- Bên phải -->
    <div class="auth-box">

        <h2>Đăng ký</h2>

        <p class="subtitle">
            Tạo tài khoản để khám phá Hanami BookStore.
        </p>

        <form id="registerForm">

            <div class="form-group">
                <label for="name">Họ và tên</label>

                <input
                    type="text"
                    id="name"
                    minlength="2"
                    maxlength="50"
                    placeholder="Nhập họ và tên"
                    required>
            </div>


            <div class="form-group">
                <label for="registerEmail">Email</label>

                <input
                    type="email"
                    id="registerEmail"
                    placeholder="Nhập email"
                    required>
            </div>


            <div class="form-group">
                <label for="registerPassword">Mật khẩu</label>

                <input
                    type="password"
                    id="registerPassword"
                    minlength="8"
                    maxlength="20"
                    pattern="(?=.*[A-Za-z])(?=.*[0-9]).{8,20}"
                    title="Mật khẩu phải có từ 8 đến 20 ký tự, bao gồm chữ cái và chữ số"
                    placeholder="Nhập mật khẩu"
                    required>
            </div>


            <div class="form-group">
                <label for="confirmPassword">Xác nhận mật khẩu</label>

                <input
                    type="password"
                    id="confirmPassword"
                    placeholder="Nhập lại mật khẩu"
                    required>
            </div>

            <div class="terms">
            <label>
                <input type="checkbox" required>
                Tôi đồng ý với
                <a href="#">Điều khoản sử dụng của Hanami</a>
            </label>
        </div>
            <button type="submit" class="auth-btn">
                Đăng ký
            </button>

        </form>


        <p class="auth-link">
            Đã có tài khoản?
            <a href="dangnhap.html">Đăng nhập</a>
        </p>
          <a href="index.html" class="close-btn"
     aria-label="Quay về trang chủ"
    title="Về trang chủ">&times;</a>

    </div>

</div>

<script src="auth.js"></script>
<script src="thongbao.js"></script>

</body>
</html>
