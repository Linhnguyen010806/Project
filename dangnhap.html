<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Hanami Book</title>

    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-container">

    <!-- Bên trái -->
    <div class="auth-intro">

        <h1>Hanami Book</h1>

        <p>
            Mỗi cuốn sách là<br>
            một hành trình.
        </p>

        <span>
            Tìm cuốn sách dành cho riêng bạn.
        </span>

    </div>


    <!-- Bên phải -->
    <div class="auth-box">

        <h2>Đăng nhập</h2>

        <p class="subtitle">
            Chào mừng bạn quay trở lại với Hanami Book!
        </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Nhập email của bạn"
                    required>
            </div>


            <div class="form-group">
                <label for="password">Mật khẩu</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Nhập mật khẩu"
                    required>
            </div>


            <button type="submit" class="auth-btn">
                Đăng nhập
            </button>

        </form>


        <p class="auth-link">
            Chưa có tài khoản?
            <a href="dangky.html">Đăng ký</a>
        </p>


        <a href="index.html" class="home-link">
            ← Quay lại trang chủ
        </a>

    </div>

</div>

<script src="auth.js"></script>

</body>
</html>
