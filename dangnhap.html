<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Đăng nhập - Hanami BookStore</title>
    <link rel="stylesheet" href="thongbao.css">
    <link rel="stylesheet" href="auth.css">
</head>

<body>

<div class="auth-container">

    <!-- Bên trái -->
    <!-- <div class="auth-intro">

        <h1>Hanami BookStore</h1>

        <p>
            Mở một trang sách,<br>
            mở một thế giới.

        <span>
            Hanami BookStore đồng hành cùng bạn trên mỗi hành trình khám phá tri thức.

    <div class="auth-intro">

    <!-- <div class="book-icon">📖</div> -->

    <h1>Hanami BookStore</h1>

    <div class="intro-line"></div>

    <p class="slogan">
    <span>Mở một trang sách,</span>
    <span>mở một thế giới.</span>
    </p>

    <p class="intro-text">
        Hanami BookStore đồng hành cùng bạn<br>
        trên mỗi hành trình khám phá tri thức.
    </p>

    <div class="quote">
        “Một cuốn sách hay có thể thay đổi một cuộc đời.”
    </div>

</div>


    <!-- Bên phải -->
    <div class="auth-box">

        <h2>Đăng nhập</h2>

       <p class="subtitle">
        Chào mừng bạn quay trở lại với
        <span class="brand-name">Hanami BookStore!</span>
       </p>

        <form id="loginForm">

            <div class="form-group">
                <label for="email">Email</label>

                <input
                    type="email"
                    id="email"
                    placeholder="Nhập email của bạn"
                    required>
            </div>


            <div class="form-group">
                <label for="password">Mật khẩu</label>

                <input
                    type="password"
                    id="password"
                    placeholder="Nhập mật khẩu"
                    required>
            </div>


            <button type="submit" class="auth-btn">
                Đăng nhập
            </button>

        </form>


        <p class="auth-link">
            Chưa có tài khoản?
            <a href="dangky.html" target ="_self">Đăng ký</a>
        </p>
        <!-- target="_self" giúp trang đăng ký mở ngay trong iframe hiện tại, không làm thay đổi trang chủ bên ngoài. -->
    
        <!-- <a href="index.html" class="close-btn"
   aria-label="Quay về trang chủ"
    title="Về trang chủ">&times;</a> -->
    <button type="button" class="close-btn"
        onclick="window.parent.postMessage('closeAuthPopup', '*')" 
        aria-label="Đóng cửa sổ"
        title="Đóng">&times;</button>
    <!-- window.parent: truy cập trang chủ đang chứa iframe.
    postMessage: gửi tín hiệu đến trang chủ.
    closeAuthPopup: tín hiệu yêu cầu đóng popup. 
    mở popup, chuyển từ đăng nhập sang đăng ký và đóng popup.-->

    </div>

</div>

<script src="auth.js"></script>
<script src="thongbao.js"></script>
</body>
</html>
