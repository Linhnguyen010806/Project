<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Header</title>
</head>
<body>
    
<header class="header">

    <!-- PHẦN TRÊN: LOGO - TÌM KIẾM - TIỆN ÍCH -->
    <div class="top-bar">

        <!-- LOGO -->
        <div class="logo">
            <a href="index.html">
                <img src="images/hanami_logo.png"
                     alt="Hanami Bookstore">
            </a>
        </div>

        <!-- THANH TÌM KIẾM -->
        <div class="search-box">

            <input type="text"
                   id="o-tim-kiem"
                   placeholder="Tìm kiếm tên sách hoặc tác giả...">

            <button id="nut-tim-kiem" type="button">
                <i class="fas fa-search"></i>
            </button>

            <!-- LỊCH SỬ TÌM KIẾM -->
            <div id="lich-su-tim-kiem">
                <div id="danh-sach-lich-su"></div>
            </div>
        </div>

        <!-- THÔNG TIN BÊN PHẢI -->
        <div class="header-right">

            <div class="hotline">
                <i class="fa-solid fa-phone-volume"></i>
                <div>
                    <span>Hotline hỗ trợ</span>
                    <strong>0982 909 069</strong>
                </div>
            </div>

            <div class="top-icons">

                <a href="dangnhap.html" title="Tài khoản">
                    <i class="fas fa-user"></i>
                </a>

                <a href="#"
                   class="notification-icon"
                   title="Thông báo">
                    <i class="fas fa-bell"></i>
                </a>

                <a href="yeuthich.html"
                   class="favorite-icon"
                   title="Yêu thích">
                    <i class="fas fa-heart"></i>
                </a>

                <a href="#" title="Giỏ hàng" id="nut-mo-gio-hang">
                    <span class="cart-icon-wrap">
                        <i class="fas fa-shopping-cart"></i>
                        <span id="so-luong-gio-hang">0</span>
                    </span>
                </a>

            </div>
        </div>

    </div>

    <!-- PHẦN MENU ĐIỀU HƯỚNG -->
    <div class="navbar">

        <!-- DANH MỤC SÁCH -->
        <div class="category-menu">

            <button class="category-btn" type="button">
                <i class="fas fa-bars"></i>
                <span>Danh mục sách</span>
                <i class="fas fa-chevron-down arrow"></i>
            </button>

            <div class="category-list">
                <a href="dmsp.html#phat-trien-ban-than">
                    Phát triển bản thân
                </a>

                <a href="dmsp.html#tieu-thuyet">
                    Tiểu thuyết
                </a>

                <a href="dmsp.html#thieu-nhi">
                    Thiếu nhi
                </a>

                <a href="dmsp.html#kinh-doanh">
                    Kinh doanh
                </a>

                <a href="dmsp.html#sach-hoc-ngoai-ngu">
                    Sách học ngoại ngữ
                </a>

                <a href="dmsp.html#sach-tham-khao">
                    Sách tham khảo
                </a>
            </div>

        </div>

        <!-- MENU NGANG -->
        <nav class="main-menu">

            <a href="index.html" >
                <i class="fas fa-home"></i>
                Trang chủ
            </a>

            <a href="gioithieu.html">Giới thiệu</a>

            <a href="khuyenmai.html" >Khuyến mãi</a>

            <a href="lienhe.html" >Liên hệ</a>

            <a href="index.html#customer-reviews" >Phản hồi</a>

        </nav>

    </div>

</header>


<!--popup giỏ hàng-->
<div class="popup-gio-hang" id="popup-gio-hang">
    <div class="nen-gio-hang"></div>

   <div class="khung-gio-hang">
        <div class="dau-gio-hang">
            <h2>Giỏ hàng của bạn</h2>
            <button id="dong-gio-hang"> &times;</button>
        </div>

        <div id="danh-sach-gio-hang"></div>

        <div id="cuoi-gio-hang">
            <div class="tong-tien">
                <span>Tổng tiền:</span>
                <strong id="tong-tien-gio-hang">0đ</strong>
            </div>

            <button class="nut-thanh-toan">Thanh toán</button>
        </div>
   </div>

</div>
</body>
</html>
